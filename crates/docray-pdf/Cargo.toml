[package]
name = "docray-pdf"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
docray-model = { path = "../docray-model" }
docray-core = { path = "../docray-core" }
sha2 = "0.11"
serde_json.workspace = true

# Pinned exactly: this crate's extraction logic (coordinate spaces, accessor
# return types, the object/annotation traits) is tightly coupled to pdfium-render
# 0.9.4's FFI surface. A `cargo update` floating to a new 0.9.x could silently
# change that surface and break geometry/goldens, so require an intentional bump.
# `bind::pdfium()` serializes whole extractions, so the `thread_safe` feature's
# per-call global lock is pure overhead; extraction never converts or renders
# images, so `image` is unused. Only the PDFium API version is enabled.
pdfium-render = { version = "=0.9.4", default-features = false, features = ["pdfium_7881"] }

[dev-dependencies]
lopdf = "0.44"
